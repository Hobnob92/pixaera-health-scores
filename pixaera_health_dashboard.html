document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <section class=\"kpis\" id=\"rw-kpis\"><\u002Fsection>\n      <main class=\"board-wrap\"><div id=\"rw-board\" style=\"height:100%\"><\u002Fdiv><\u002Fmain>\n\n      <footer class=\"legend\">\n        <span class=\"ttl\">HEALTH<\u002Fspan>\n        <div class=\"grp\">\n          <span class=\"lk\"><i style=\"background:#EF4444\"><\u002Fi>CRITICAL &lt;30<\u002Fspan>\n          <span class=\"lk\"><i style=\"background:#F59E0B\"><\u002Fi>AT RISK 30–59<\u002Fspan>\n          <span class=\"lk\"><i style=\"background:#00C9B1\"><\u002Fi>HEALTHY 60+<\u002Fspan>\n        <\u002Fdiv>\n        <span class=\"ttl\" style=\"margin-left:8px\">RENEWAL<\u002Fspan>\n        <div class=\"grp\">\n          <span class=\"lk\"><i style=\"background:#EF4444\"><\u002Fi>≤7D / OVERDUE<\u002Fspan>\n          <span class=\"lk\"><i style=\"background:#F59E0B\"><\u002Fi>≤30D<\u002Fspan>\n          <span class=\"lk\"><i style=\"background:#00C9B1\"><\u002Fi>ON TRACK<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"src\"><span class=\"d\"><\u002Fspan><span id=\"rw-srcTxt\">HUBSPOT · RENEWAL PIPELINE · SNAPSHOT<\u002Fspan><\u002Fdiv>\n      <\u002Ffooter>\n\n      <div id=\"rw-loader\">\n        <div class=\"spin\"><svg width=\"54\" height=\"54\" viewBox=\"0 0 58 58\" fill=\"none\">\n          <circle cx=\"29\" cy=\"29\" r=\"25\" stroke=\"rgba(120,160,205,0.18)\" stroke-width=\"4\"><\u002Fcircle>\n          <path d=\"M29 4 a25 25 0 0 1 25 25\" stroke=\"#00C9B1\" stroke-width=\"4\" stroke-linecap=\"round\"><\u002Fpath>\n        <\u002Fsvg><\u002Fdiv>\n        <div class=\"txt\">FETCHING PIPELINE<span class=\"dots\"><\u002Fspan><\u002Fdiv>\n        <div class=\"sub\" id=\"rw-loadSub\">CONNECTING · HUBSPOT<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"rw-detail\" aria-hidden=\"true\"><\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ═══════════════ TAB 2 · HEALTH SCORES ═══════════════ -->\n    <section id=\"tab-health\" class=\"t 2Fdiv>\n            <div class=\"sc\"><div class=\"sl\">AT RISK (40–69)<\u002Fdiv><div class=\"sv\" style=\"color:var(--amber)\" id=\"st-a\">—<\u002Fdiv><\u002Fdiv>\n            <div class=\"sc\"><div class=\"sl\">CRITICAL (&lt;40)<\u002Fdiv><div class=\"sv\" style=\"color:var(--red)\" id=\"st-c\">—<\u002Fdiv><\u002Fdiv>\n            <div class=\"sc\"><div class=\"sl\">TOTAL ARR<\u002Fdiv><div class=\"sv\" id=\"st-arr\">—<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"toolbar\">\n            <div class=\"tg\"><label>CSM<\u002Flabel><select id=\"csm-f\"><option value=\"\">All CSMs<\u002Foption><\u002Fselect><\u002Fdiv>\n            <div class=\"tsep\"><\u002Fdiv>\n            <div class=\"tg\"><label>SENTIMENT<\u002Flabel><select id=\"sent-f\">\n              <option value=\"\">All<\u002Foption><option value=\"healthy\">Healthy<\u002Foption><option value=\"neutral\">Neutral<\u002Foption><option value=\"at_risk\">At risk<\u002Foption><option value=\"none\">Not set<\u002Foption>\n            <\u002Fselect><\u002Fdiv>\n            <div class=\"tsep\"><\u002Fdiv>\n            <div class=\"tg\"><label>JOURNEY<\u002Flabel><select id=\"jp-f\">\n              <option value=\"\">All<\u002Foption><option value=\"Deployed &amp; Growing\">Deployed &amp; Growing<\u002Foption><option value=\"Deployed\">Deployed<\u002Foption><option value=\"Adopting\">Adopting<\u002Foption><option value=\"Onboarding\">Onboarding<\u002Foption><option value=\"none\">Not set<\u002Foption>\n            <\u002Fselect><\u002Fdiv>\n            <div class=\"tsep\"><\u002Fdiv>\n            <div class=\"tg\"><label>COMPLETIONS<\u002Flabel><select id=\"mau-f\">\n              <option value=\"\">All<\u002Foption><option value=\"growing\">Growing (&gt;20%)<\u002Foption><option value=\"stable\">Stable<\u002Foption><option value=\"declining\">Declining (&lt;-20%)<\u002Foption><option value=\"none\">No data<\u002Foption>\n            <\u002Fselect><\u002Fdiv>\n            <div class=\"tsep\"><\u002Fdiv>\n            <div class=\"tg\"><label>SEARCH<\u002Flabel><input type=\"text\" id=\"srch\" placeholder=\"Company…\" style=\"width:130px\"><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"leg\">\n            <span><span class=\"ld\" style=\"background:#00C9B1\"><\u002Fspan>70–100 HEALTHY<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#F59E0B\"><\u002Fspan>40–69 AT RISK<\u002Fspan>\n            <span><span class=\"ld\" style=\"background:#EF4444\"><\u002Fspan>UNDER 40 CRITICAL<\u002Fspan>\n            <span class=\"pill ppu\">over-contracted<\u002Fspan><span style=\"color:var(--text3)\">= users &gt; seats (expansion signal)<\u002Fspan>\n            <span style=\"color:var(--text3);margin-left:4px\">Click score for breakdown<\u002Fspan>\n          <\u002Fdiv>\n\n          <div id=\"panel-scores\">\n            <div class=\"tw\"><div id=\"tc\"><div class=\"loading\"><span class=\"spin\"><\u002Fspan>Loading…<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div id=\"panel-trends\" style=\"display:none\">\n            <div style=\"background:linear-gradient(180deg,rgba(16,31,52,0.45),rgba(10,19,34,0.25));border-radius:12px;border:1px solid var(--hair);padding:20px\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px\">\n                <div>\n                  <div style=\"font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:1px;margin-bottom:4px;color:var(--ink)\">HEALTH SCORE TRENDS<\u002Fdiv>\n                  <div style=\"font-size:12px;color:var(--text2)\">A data point is recorded each Monday (and on every sync to HubSpot). History is stored on the company record.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n                  <select id=\"trend-csm\" onchange=\"renderTrends()\" class=\"btn\"><option value=\"\">All CSMs<\u002Foption><\u002Fselect>\n                  <select id=\"trend-filter\" onchange=\"renderTrends()\" class=\"btn\">\n                    <option value=\"all\">All companies<\u002Foption><option value=\"healthy\">Healthy only<\u002Foption><option value=\"atrisk\">At risk only<\u002Foption><option value=\"critical\">Critical only<\u002Foption>\n                  <\u002Fselect>\n                  <button class=\"btn\" onclick=\"if(confirm('Record a snapshot now for all accounts?'))writeSnapshotToHubSpot()\">Record snapshot<\u002Fbutton>\n                  <button class=\"btn ghost\" onclick=\"clearHistory()\">Clear history<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div id=\"trend-chart-wrap\"><\u002Fdiv>\n              <div style=\"font-size:11px;color:var(--text3);margin-top:12px\" id=\"trend-footer\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n\n  <script src=\"60879f6c-2d11-4549-b9a0-d05815d16f32\"><\u002Fscript>\n  <script src=\"17659e52-9ea7-446d-a55a-c84817c2955d\"><\u002Fscript>\n  <script>\n    /* master tab controller + shared clock */\n    const TABS = { renewals: document.getElementById('tab-renewals'), health: document.getElementById('tab-health') };\n    function showTab(name){\n      for (const k in TABS) TABS[k].hidden = (k !== name);\n      document.querySelectorAll('#mtabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));\n      if (name==='renewals' && window.RW) RW.init();\n      if (name==='health'  && window.Health) Health.init();\n    }\n    document.getElementById('mtabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) showTab(b.dataset.tab); });\n    function tick(){\n      const n = new Date();\n      document.getElementById('clock').textContent = n.toLocaleTimeString('en-GB',{hour12:false});\n      document.getElementById('cdate').textContent = n.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}).toUpperCase();\n    }\n    setInterval(tick, 1000); tick();\n    showTab('renewals');\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
